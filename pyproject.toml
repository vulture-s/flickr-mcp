[project]
name = "flickr-mcp"
version = "0.1.0"
description = "Read+write Flickr access for Claude via the Model Context Protocol"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "requests>=2.31.0",
    "requests-oauthlib>=1.3.1",
]

[project.scripts]
flickr-mcp = "flickr_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flickr_mcp"]
